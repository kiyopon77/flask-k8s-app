name: Build and Deploy
on:
  push:
    branches: [ main ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/flask-docker-app:${{ github.sha }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/flask-docker-app:${{ github.sha }}
      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
      - name: Update image and apply manifests
        run: |
          kubectl set image deployment/flask-app flask-app=${{ secrets.DOCKERHUB_USERNAME }}/flask-docker-app:${{ github.sha }}
          kubectl apply -f k8s/
          kubectl rollout status deployment/flask-app
